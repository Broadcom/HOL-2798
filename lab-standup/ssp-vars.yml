# ── Cloud Connector ────────────────────────────────────────────────────────────
cloud_connector_region: "west.us"          # see GET /ssp/lcm/cloud-connector/regions

# ── Malware Prevention ─────────────────────────────────────────────────────────
malware_analysis_mode: "CLOUD"             # CLOUD or ON_PREM
malware_file_metadata_sharing: true
malware_file_sharing: true

# ── Timeouts (minutes) ─────────────────────────────────────────────────────────
boot_timeout_minutes: 30
api_timeout_minutes: 20
provider_timeout_minutes: 90
bundle_timeout_minutes: 90
platform_timeout_minutes: 90
ssp_readiness_timeout_minutes: 90
site_timeout_minutes: 90
feature_timeout_minutes: 90
