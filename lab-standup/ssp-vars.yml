# ── Compute placement ──────────────────────────────────────────────────────────
datacenter_name: "dc-mgmt-a"
datastore_name: "vsan-mgmt-01a"
resource_pool_path: "Resources"    # resource pool for the SSPI VM
esxi_host: "esxi-host.example.com"
vm_name: "sspi-01"
cluster_name: "Cluster"
resource_pool_name: "SSP"                  # resource pool for SSP platform VMs
storage_policy_name: "vSAN Default Storage Policy"
enable_resource_reservation: false

# ── Network placement ──────────────────────────────────────────────────────────
portgroup_name: "mgmt"
dvs_name: "vds01-mgmt-01a"
dvs_id: "dvs-28"                           # managed-object ID of the DVS

# OVF network map key — must match the OVF descriptor network name.
sspi_ovf_network_name: "VM Network"

# ── SSPI appliance credentials ─────────────────────────────────────────────────
sspi_username: "admin"                     # SSPI API username
admin_password: "{{ lab_pw }}"                # vault recommended
grub_password: "{{ lab_pw }}"                 # vault recommended
sysadmin_password: "{{ lab_pw }}"              # vault recommended
audit_password: "{{ lab_pw }}"                # vault recommended

# ── SSPI appliance network ─────────────────────────────────────────────────────
sspi_fqdn: "ssp-i.site-a.vcf.lab"
sspi_ip: "10.1.0.10"
sspi_netmask: "255.255.255.0"
sspi_gateway: "10.1.0.1"
internal_cluster_cidr: "10.10.0.0/16"
dns_servers:
  - "10.0.0.2"
dns_search_domain: "site-a.vcf.lab"
ntp_servers:
  - "10.1.1.1"
ssh_enabled: true

# ── SSP platform shared network settings ──────────────────────────────────────
ntp_server: "10.1.1.1"
search_domain: "site-a.vcf.lab"

# ── SSP platform instances ─────────────────────────────────────────────────────
# Add one dict per platform instance. The loop in sspi_api will iterate over
# this list and call sspi_platform once per entry.
platforms:
  - instance_name: "lab"
    platform_subnet: "10.1.0.0/24"
    platform_gateway: "10.1.0.1"
    node_pool_start: "10.1.0.51"
    node_pool_end: "10.1.0.66"
    service_pool_start: "10.1.0.68"
    service_pool_end: "10.1.0.79"
    ingress_fqdn: "ssp.site-a.vcf.lab"
    kafka_fqdn: "ssp-m.site-a.vcf.lab"
    ssp_admin_password: "{{ lab_pw }}"         # vault recommended
    ssp_audit_password: "{{ lab_pw }}"         # vault recommended
    # Optional sizing overrides (defaults shown):
    # system_form_factor: "LARGE"
    # system_ssp_type: "ATP"
    # controller_count: 3
    # worker_count: 5

  # Uncomment to add a second instance:
  # - instance_name: "staging"
  #   platform_subnet: "10.1.0.0/24"
  #   platform_gateway: "10.1.0.1"
  #   ...

# ── Derived URLs (computed from variables above) ───────────────────────────────
sspi_base_url: "https://{{ sspi_ip }}"
ssp_base_url: "https://{{ platforms[0].ingress_fqdn }}"
ssp_username: "admin"

# ── Telemetry (CEIP) ───────────────────────────────────────────────────────────
ceip_acceptance: false
telemetry_agreement_displayed: true

# ── Backup — SFTP server ───────────────────────────────────────────────────────
backup_server_address: "10.0.0.2"
backup_server_port: 22
backup_username: "backupuser"
backup_password: "{{ lab_pw }}"                # vault recommended
backup_ssh_public_key: "ssh-rsa AAAA..."
backup_location: "/backups/ssp"
backup_passphrase: "{{ lab_pw }}"              # vault recommended

# ── Backup — recurring schedule ────────────────────────────────────────────────
backup_recurring_enabled: true
backup_schedule_type: "WEEKLY"             # WEEKLY or INTERVAL
backup_weekly_days:
  - "SUNDAY"
backup_weekly_hour: 2
backup_weekly_minute: 0
# backup_interval_hours: 168              # used when backup_schedule_type=INTERVAL

