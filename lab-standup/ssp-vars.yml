---
# ══════════════════════════════════════════════════════════════════════════════
# SSP Ansible Deployment — HOL-2770
#
# Copy this file to group_vars/all.yml and fill in your environment values.
# For production use, store sensitive values (passwords, certificates) using
# Ansible Vault:  ansible-vault encrypt_string 'MySecret' --name 'admin_password'
# ══════════════════════════════════════════════════════════════════════════════
lab_pw: "{{ lookup('file', '/home/holuser/creds.txt')}}"


